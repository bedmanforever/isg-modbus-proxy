# EVCC custom switchsocket recipe for the ISG-controlled heat pump.
# Merge these entries into an otherwise valid evcc.yaml under chargers:.
# Replace PROXY_HOST with the reachable host/IP of the Modbus proxy.
# Replace SHELLY_HOST with the Shelly 3EM Pro host/IP.
# The Shelly must measure only the heat pump; /emeter/N returns power in W.
# "Disabled" restores a lower DHW target; it does NOT turn the heat pump off.
# enabled means the boost target is requested, not that the compressor is running.
# Verify proxy writes/readback against your ISG before relying on automation.

chargers:
  - name: waermepumpe
    type: switchsocket

    enable:
      source: js
      script: |
        enable ? 55.0 : 45.0;
      out:
        - name: target
          type: float
          config:
            source: modbus
            uri: PROXY_HOST:502
            id: 1
            timeout: 15s
            register:
              address: 800
              type: writeholding
              decode: uint16
            scale: 10

    enabled:
      source: js
      script: raw >= 550;
      in:
        - name: raw
          type: float
          config:
            source: modbus
            uri: PROXY_HOST:502
            id: 1
            timeout: 15s
            register:
              address: 800
              type: holding
              decode: uint16

    # Shelly /emeter/N power values are W. Cache briefly because evcc
    # may evaluate calc operands sequentially and requests within 1 second
    # to the same URI are rejected by the HTTP plugin.
    power:
      source: calc
      add:
        - source: http
          uri: http://SHELLY_HOST/emeter/0
          jq: .power
          timeout: 5s
          cache: 2s
        - source: http
          uri: http://SHELLY_HOST/emeter/1
          jq: .power
          timeout: 5s
          cache: 2s
        - source: http
          uri: http://SHELLY_HOST/emeter/2
          jq: .power
          timeout: 5s
          cache: 2s

    # Optional DHW actual temperature in °C; remove if not needed.
    temp:
      source: modbus
      uri: PROXY_HOST:502
      id: 1
      timeout: 15s
      register:
        address: 503
        type: holding
        decode: int16
      scale: 0.1
