# No EVCC switchsocket configuration is supplied here: there is no truthful
# heat-pump electric-power measurement available from this proxy.
#
# EVCC's custom charger subtype is `type: switchsocket`. Its documented config
# requires `enabled`, `enable`, and `power`. Although the implementation allows
# omitting `power` with a negative `standbypower`, that static mode reports the
# configured wattage as power; it would invent a measurement for this heat pump.
#
# A truthful `enabled` getter could report whether the observed comfort target
# at holding register 800 is at least the configured boost target. That means
# "boost target requested", not "heat pump is heating". The optional `temp`
# getter can report actual DHW temperature from holding register 503. `enable`
# could write the configured boost/normal targets to register 800, each within
# the proxy's 10–60 °C limit. EVCC still cannot use the switchsocket without a
# real power measurement, so use the Home Assistant switches in
# home-assistant-modbus.yaml instead.
#
# Replace PROXY_HOST in home-assistant-modbus.yaml with the proxy's host.
# Its comfort switch writes 50 °C on and restores 48 °C off. Off is a return to
# the normal target, not a command to switch the heat pump off.
